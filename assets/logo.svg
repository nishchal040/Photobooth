<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF537C" />
      <stop offset="50%" stop-color="#D4537E" />
      <stop offset="100%" stop-color="#8E24AA" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2A40" />
      <stop offset="100%" stop-color="#151522" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#2979FF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8E24AA" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Main Camera Body -->
  <rect x="48" y="128" width="416" height="288" rx="56" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Camera Top Flash Notch -->
  <path d="M 180 128 L 210 80 Q 216 70 228 70 L 284 70 Q 296 70 302 80 L 332 128 Z" fill="url(#bgGrad)" />

  <!-- Viewfinder Box -->
  <rect x="96" y="176" width="48" height="36" rx="10" fill="#FFFFFF" opacity="0.25" />

  <!-- Flash Light -->
  <circle cx="400" cy="194" r="20" fill="#FFE082" />
  <circle cx="400" cy="194" r="12" fill="#FFF59D" />

  <!-- Outer Lens Ring -->
  <circle cx="256" cy="272" r="104" fill="#FFFFFF" opacity="0.9" />
  <circle cx="256" cy="272" r="92" fill="url(#lensGrad)" />
  <circle cx="256" cy="272" r="68" fill="url(#glassGrad)" />

  <!-- Lens Glare -->
  <circle cx="236" cy="252" r="22" fill="#FFFFFF" opacity="0.65" />
  <circle cx="276" cy="292" r="8" fill="#FFFFFF" opacity="0.4" />

  <!-- Photo Strip Icon Accent -->
  <g transform="translate(380, 290) rotate(12) scale(0.65)">
    <rect x="0" y="0" width="80" height="150" rx="12" fill="#FFFFFF" filter="url(#shadow)" />
    <rect x="10" y="12" width="60" height="40" rx="4" fill="#FF80AB" />
    <rect x="10" y="58" width="60" height="40" rx="4" fill="#8C9EFF" />
    <rect x="10" y="104" width="60" height="34" rx="4" fill="#A7FFEB" />
  </g>
</svg>
